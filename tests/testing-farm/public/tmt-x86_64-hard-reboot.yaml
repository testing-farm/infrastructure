---

extends:
  - base-tmt_checks

marks:
  - public
  - pipeline

variables:
  COMPOSE: Fedora-latest
  ARCH: x86_64
  RESULT: PASSED
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/reboot

testing-farm: |
  testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --plan {{ PLAN }} \
      --compose {{ COMPOSE }} \
      --arch {{ ARCH }} \
      --skip-summary

checks:
  literal-patterns[citool-debug.txt]:
    - "tmt --root . -c arch=x86_64 --allow-unsafe-behavior=provision/connect.reboot-commands run --all --verbose --id /var/ARTIFACTS/{{ workdir_pattern }} -e @tmt-environment-testing-farm-reboot.yaml provision --how connect --guest {{ hostname_ip_address_pattern }} --key {{ citool_config_secret_path_pattern }}/id_rsa_artemis.decrypted --port 22 {{ \"(?:--soft-reboot '' --systemd-soft-reboot '' )?\" }}--hard-reboot '/opt/artemis-cli/bin/artemis-cli guest reboot {{ artemis_guestname_pattern }}' plan --name '^/testing\\-farm/reboot$'"
    - "[archive] syncing {{ '.+' }}citool-config to /tmp/{{ REQUEST_ID }}/."

  literal-strings:
    - "[testing-farm-request-state-reporter] pipeline complete"

  artifacts:
    - "guest-setup-{{ artemis_guestname_pattern }}"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-pre-artifact-installation.txt"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-post-artifact-installation.txt"
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"
