---

extends:
  - base-tmt_checks

marks:
  - public
  - pipeline

variables:
  ARCH: x86_64
  RESULT: PASSED
  COMPOSE: Fedora-Rawhide
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/sanity

testing-farm: |
  testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --plan {{ PLAN }} \
      --compose {{ COMPOSE }} \
      --arch {{ ARCH }} \
      --repository https://download.copr.fedorainfracloud.org/results/mkluson/pycho/fedora-rawhide-x86_64/ \
      --skip-summary

checks:
  literal-patterns:
    - "[artemis] [{{ artemis_guestname_pattern }}] Create artifacts directory"
    - "[artemis] [{{ artemis_guestname_pattern }}] Download packages"
    - "[artemis] [{{ artemis_guestname_pattern }}] Reinstall packages"
    - "[artemis] [{{ artemis_guestname_pattern }}] Downgrade packages"
    - "[artemis] [{{ artemis_guestname_pattern }}] Update packages"
    - "[artemis] [{{ artemis_guestname_pattern }}] Install packages"
    - "[artemis] [{{ artemis_guestname_pattern }}] Verify all packages installed"

  literal-strings:
    - "[testing-farm-request-state-reporter] pipeline complete"

  artifacts:
    - "guest-setup-{{ artemis_guestname_pattern }}"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-pre-artifact-installation.txt"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-post-artifact-installation.txt"
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"

  literal-patterns[citool-debug.txt]:
    - "[archive] syncing {{ '.+' }}citool-config to /tmp/{{ REQUEST_ID }}/."
