---

extends:
  - base-tmt_checks

marks:
  - public
  - pipeline

variables:
  COMPOSE: Fedora-Rawhide
  ARCH: x86_64
  RESULT: PASSED
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/test-filter
  SCHEDULE_ENTRIES: 36  # Skipped plans are included

testing-farm: |
  testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --test-filter tag:test-filter \
      --compose {{ COMPOSE }} \
      --arch {{ ARCH }} \
      --skip-summary

checks:
  literal-strings:
    - "[archive] Stopping parallel archiving"

  artifacts:
    - "guest-setup-{{ artemis_guestname_pattern }}"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-pre-artifact-installation.txt"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-post-artifact-installation.txt"
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"

  literal-patterns[citool-debug.txt]:
    - "[archive] syncing {{ '.+' }} to artifacts@artifacts.{{ '.+' }}.testing-farm.io:/var/data/artifacts/{{ REQUEST_ID }}/."
