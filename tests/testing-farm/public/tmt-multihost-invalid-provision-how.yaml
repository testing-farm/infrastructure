---

extends:
  - base-tmt-multihost_checks

marks:
  - public
  - pipeline

variables:
  COMPOSE: Fedora-Rawhide
  ARCH: x86_64
  RESULT: ERROR
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/multihost/invalid-provision-how
  SCHEDULE_ENTRIES: 1
  TMT_EXIT_CODE: 2

testing-farm: |
  ! testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --plan {{ PLAN }} \
      --compose {{ COMPOSE }} \
      --arch {{ ARCH }} \
      --pipeline-type tmt-multihost \
      --skip-summary

checks:
  literal-patterns[results.xml]:
    - |
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuites overall-result="error">
       <properties>
        <property name="baseosci.overall-result" value="error"/>
       </properties>
       <testsuite name="{{ PLAN }}" result="error" tests="0" stage="complete">
        <error message="tmt errored out" name="tmt-log" href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}/tmt-run.log"/>
        <logs>
         <log href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}{{ PLAN }}/data" name="data"/>
         <log href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}/tmt-run.log" name="tmt-log"/>
         <log href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}/tmt-reproducer.sh" name="tmt-reproducer"/>
         <log href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}/log.txt" name="tmt-verbose-log"/>
         <log href="{{ artifacts_url_pattern }}/{{ REQUEST_ID }}/work-invalid-provision-how{{ '.+' }}" name="workdir"/>
        </logs>
        <properties>
         <property name="baseosci.result" value="error"/>
         <property name="id" value="work-invalid-provision-how{{ '.+' }}_testing-farm-multihost-invalid-provision-how"/>
        </properties>
       </testsuite>
      </testsuites>

  literal-patterns:
    - "[{{ COMPOSE }}:{{ ARCH }}:{{ PLAN }}]{{ '.+' }}Unsupported provision method 'virtual' in the '{{ PLAN }}' plan."

  literal-strings:
    - "[W] [test-schedule-tmt-multihost] The `how` key in provision phase should not be `artemis`."
    - "[testing-farm-request-state-reporter] pipeline complete"

  artifacts:
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"

  literal-patterns[citool-debug.txt]:
    - "[archive] syncing {{ '.+' }}citool-config to /tmp/{{ REQUEST_ID }}/."
