---

extends:
  - base-tmt_checks

marks:
  - public
  - pipeline
  - image-mode

variables:
  COMPOSE: Fedora-43-image-mode
  ARCH: x86_64
  RESULT: PASSED
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/sanity

testing-farm: |
  testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --plan {{ PLAN }} \
      --compose {{ COMPOSE }} \
      --arch {{ ARCH }} \
      --fedora-copr-build 9604630:fedora-43-x86_64 \
      --skip-summary

checks:
  literal-patterns:
    - "[artemis] [{{ artemis_guestname_pattern }}] Create artifacts directory"
    - "[artemis] [{{ artemis_guestname_pattern }}] Download copr repository"
    - "[artemis] [{{ artemis_guestname_pattern }}] Download rpms from copr"
    - "[artemis] [{{ artemis_guestname_pattern }}] Install copr build with TMT"
    - "[artemis] [{{ artemis_guestname_pattern }}] Verify packages installed"
    - "[{{ COMPOSE }}:{{ ARCH }}:{{ PLAN }}] artifact installed"

  literal-strings:
    - "[testing-farm-request-state-reporter] pipeline complete"

  artifacts:
    - "guest-setup-{{ artemis_guestname_pattern }}"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-pre-artifact-installation.txt"
    - "guest-setup-{{ artemis_guestname_pattern }}/guest-setup-output-post-artifact-installation.txt"
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"

  literal-patterns[citool-debug.txt]:
    - "[archive] syncing {{ '.+' }}citool-config to /tmp/{{ REQUEST_ID }}/."
