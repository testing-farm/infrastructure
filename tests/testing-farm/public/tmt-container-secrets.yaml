---

extends:
  - base-tmt-container_checks

marks:
  - public
  - pipeline
  - container

variables:
  ARCH: x86_64
  RESULT: PASSED
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/sanity

testing-farm: |
  testing-farm request \
      --git-url {{ GIT_CLONE_URL }} \
      --git-ref {{ GIT_REF }} \
      --plan {{ PLAN }} \
      --arch {{ ARCH }} \
      --environment 'SCRIPT="test $SECRET = some-secret"' \
      --secret SECRET=some-secret \
      --skip-summary

checks:
  literal-patterns[citool-debug.txt]:
    - "[hide-secrets] Hiding secrets from all files under './citool-debug.txt' path"
    - "[archive] syncing {{ '.+' }}citool-config to /tmp/{{ REQUEST_ID }}/."

  literal-patterns:
    - "[None:x86_64:/testing-farm/sanity]             00:00:0{{ '\\d+' }} pass /testing-farm/script (on default-0) [1/1]"
    - |
      [testing-farm-request] Initialized with {{ REQUEST_ID }}:
      {
          "environments_requested": [
              {
                  "arch": "{{ ARCH }}",
                  "artifacts": [],
                  "secrets": "hidden",
                  "snapshots": false,
                  "tmt": {
                      "context": {
                          "arch": "{{ ARCH }}"
                      },
                      "environment": null,
                      "extra_args": null,
                      "policy": null
                  },
                  "variables": {
                      "SCRIPT": "test $SECRET = some-secret",
                      "TESTING_FARM_GIT_REF": "main",
                      "TESTING_FARM_GIT_URL": "{{ GIT_CLONE_URL }}",
                      "TESTING_FARM_REQUEST_ID": "{{ REQUEST_ID }}",
                      "TESTING_FARM_TEST_TYPE": "fmf"
                  }
              }
          ],
          "plan": "{{ PLAN }}",
          "plan_filter": "<not applicable>",
          "ref": "main",
          "test_filter": "<not applicable>",
          "test_name": "<not applicable>",
          "type": "fmf",
          "url": "{{ GIT_CLONE_URL }}",
          "webhook_url": "<no webhook specified>"
      }

  literal-strings:
    - "[testing-farm-request-state-reporter] pipeline complete"

  artifacts:
    - "citool-debug\\.txt"
    - "git-{{ GIT_REF }}[a-z0-9_]+"
    - "work-[a-zA-Z0-9_-]+\\/tmt-reproducer\\.sh"
