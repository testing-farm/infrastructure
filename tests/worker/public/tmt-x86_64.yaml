---

extends:
  - base-tmt_pipeline
  - base-tmt_checks

marks:
  - public
  - pipeline

variables:
  REQUEST_ID: c73929f4-7523-496d-9db5-3d2b1eb6b5af
  COMPOSE: Fedora-Rawhide
  ARCH: x86_64
  RESULT: PASSED
  GIT_CLONE_URL: https://gitlab.com/testing-farm/tests
  GIT_REF: main
  PLAN: /testing-farm/sanity

checks:
  # Since tmt 1.79, these variables are no longer visible in the `environment:` debug
  # dump of the `ssh` command (tmt stopped passing them via the command's environment),
  # they are instead exported inline in the remote shell command tmt runs over `ssh`.
  # See https://redhat-internal.slack.com/archives/C03BRN71JAF/p1790841623828099 for details.
  literal-patterns[work-sanity*/log.txt]:
    - |
      Run command: ssh -oForwardX11=no -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -oConnectionAttempts=5 -oConnectTimeout=60 -oServerAliveInterval=5 -oServerAliveCountMax=60 -oIdentitiesOnly=yes -p22 -i /etc/citool.d/id_rsa_artemis.decrypted -oPasswordAuthentication=no -S/var/ARTIFACTS/work-sanity{{ '[a-zA-Z0-9_-]+' }}/ssh-sockets/{{ '[0-9.]+' }}-22-root.socket root@{{ '[0-9.]+' }} 'export TESTING_FARM_REQUEST_ID={{ REQUEST_ID }}; export TESTING_FARM_TEST_TYPE=fmf; export TESTING_FARM_GIT_URL={{ GIT_CLONE_URL }}; export TESTING_FARM_GIT_REF={{ GIT_REF }}; export TMT_VERSION={{ '\d+' }}.{{ '\d+' }}.{{ '\d+' }}{{ '[a-z0-9.+]*' }}; export TMT_TREE=/var/ARTIFACTS/work-sanity{{ '[a-zA-Z0-9_-]+' }}{{ PLAN }}/tree; export TMT_PLAN_DATA=/var/ARTIFACTS/work-sanity{{ '[a-zA-Z0-9_-]+' }}{{ PLAN }}/data; export TMT_PLAN_ENVIRONMENT_FILE=/var/ARTIFACTS/work-sanity{{ '[a-zA-Z0-9_-]+' }}{{ PLAN }}/data/variables.env-{{ '[a-zA-Z0-9_-]+' }}; export TMT_PLAN_SOURCE_SCRIPT=/var/ARTIFACTS/work-sanity{{ '[a-zA-Z0-9_-]+' }}{{ PLAN }}/data/plan-source-script.sh-{{ '[a-zA-Z0-9_-]+' }};

    # https://github.com/teemtee/tmt/pull/5209, shipped in the tmt 1.79 hotfix build from
    # https://github.com/teemtee/tmt/pull/5214, restores the *local* ssh process's own
    # environment (os.environ) for guest commands that don't set one explicitly, such as
    # the `whoami` guest readiness check below. Before the fix it logged `environment: {}`.
    - |
      ; whoami'
      {{ '\d+' }}:{{ '\d+' }}:{{ '\d+' }}{{ '\s+' }}environment:
      {{ '\s+' }}TMT_POLICY_ROOT: /etc/tmt/policies
