---
default:
  image: quay.io/testing-farm/python-ci-image:latest
  # Auto-retry infrastructure-side failures only (never `script_failure`), so a
  # runner/pod hiccup — e.g. `Job failed (system failure): couldn't get pod
  # details: Unauthorized` when the runner is redeployed mid-job — does not turn
  # the pipeline red. Real lint/terragrunt failures are NOT retried.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - api_failure

variables:
  # GitLab CI runs in world writable directory, we need to explicitely set ANSIBLE_CONFIG
  # https://docs.ansible.com/ansible/devel/reference_appendices/config.html#cfg-in-world-writable-dir
  ANSIBLE_CONFIG: ansible.cfg
  # Used only for staging/ci environment, no-op for others
  STAGING_CI_SUFFIX: $CI_MERGE_REQUEST_ID-$CI_JOB_ID
  # Set USER used to derive certain dev environment resource names
  USER: gitlab-ci-$CI_JOB_ID

workflow:
  rules:
    # for merge requests
    - if: $CI_MERGE_REQUEST_ID
    # for the tip of the default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # for schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"

.rules:
  not_default_branch:
    # do not run for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never

  not_schedule:
    # do not run for schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

  only_default_branch:
    # run only for default branch
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never

  only_schedule:
    # run only for schedule
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: never

  gitlab_ci:
    - changes:
        - .gitlab-ci.yml

  secrets:
    - changes:
        - ansible/secrets/credentials.yaml

  infrastructure:
    - !reference [.rules, secrets]
    - !reference [.rules, gitlab_ci]
    - changes:
        - .envrc
        - poetry.lock
        - Makefile*
        - setup/*

  ansible:
    - changes:
        - ansible/files/**/*
        - ansible/inventory/**/*
        - ansible/requirements.yaml
        - ansible/roles/**/*
        - ansible/tasks/**/*
        - ansible/vars/**/*

  terragrunt_modules_infra:
    - changes:
        - terragrunt/modules/gitlab/**/*

  terragrunt_modules_testing_farm:
    - changes:
        - terragrunt/modules/artemis/**/*
        - terragrunt/modules/eks/**/*
        - terragrunt/modules/localhost/**/*
        - terragrunt/modules/vault/**/*
        - terragrunt/modules/worker/**/*

  terragrunt_infra:
    - !reference [.rules, infrastructure]
    - !reference [.rules, terragrunt_modules_infra]
    - changes:
        - terragrunt/environments/infra/**/*

  terragrunt_testing_farm:
    - !reference [.rules, infrastructure]
    - !reference [.rules, terragrunt_modules_testing_farm]

  terragrunt_dev:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        # NOTE: need to be explicit here, no nice excludes supported yet
        # We do not run this when variables-composes changed for example
        # https://gitlab.com/gitlab-org/gitlab/-/issues/198688
        #
        # NOTE: we do not want this run on config changes, validation is done against staging
        - terragrunt/environments/dev/*/terragrunt.hcl
        - terragrunt/environments/dev/artemis/**/*
        - terragrunt/environments/dev/server/**/*
        - terragrunt/environments/dev/worker-public/jobs/**/*

  terragrunt_staging:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        - terragrunt/environments/staging/**/*

  terragrunt_staging_ci:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        # The staging-ci environment sources its config from these shared
        # staging dirs (e.g. ci/server symlinks to ../../server), so changes
        # there must trigger the staging-ci integration tests too.
        - terragrunt/environments/staging/artemis/**/*
        - terragrunt/environments/staging/server/**/*
        - terragrunt/environments/staging/worker-local/**/*

  terragrunt_production:
    - !reference [.rules, infrastructure]
    - changes:
        - terragrunt/environments/production/**/*

  public_compose_tests:
    - changes:
        - tests/worker/public/compose*

  public_pipeline_tests:
    - changes:
        - tests/worker/base-scenarios/*
        - tests/worker/public/tmt*
        - tests/worker/public/sti*

  redhat_pipeline_tests:
    - changes:
        - ansible/inventory/group_vars/testing_farm_redhat_workers.yaml
        - tests/testing-farm/base-scenarios/**/*
        - tests/testing-farm/playbooks/redhat-ssl-certs.yaml
        - tests/testing-farm/pytest-gluetool-redhat.fmf
        - tests/testing-farm/redhat/**/*
        - tests/testing-farm/test_testing_farm.py

direnv:
  stage: test
  before_script:
    - dnf -y install direnv libffi libffi-devel yq
    - echo -n "$VAULT_PASSWORD" > .vault_pass
  script:
    - direnv allow
    - eval "$(direnv export bash)"
    - make generate/staging/citool-config
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]

.direnv:
  before_script:
    - dnf -y install direnv libffi libffi-devel podman rsync awk yq
    - echo -n "$VAULT_PASSWORD" > .vault_pass
    - poetry env use python3.12
    - direnv allow
    - eval "$(direnv export bash)"
  script:
    - eval "$(direnv export bash)"
  artifacts:
    paths:
      - .direnv/envrc.log
    when: always

# Workaround for after_script timing-out
.script_with_cleanup:
  script:
    - /bin/bash -c "${SCRIPT}" && EXIT_CODE=$? || EXIT_CODE=$?
    - if [ ${EXIT_CODE} -ne 0 ] && [ -n "$ERROR_SCRIPT" ]; then /bin/bash -c "${ERROR_SCRIPT}" || true; fi
    - /bin/bash -c "${AFTER_SCRIPT}"
    - "[ ${EXIT_CODE} = 0 ]"

# Archive pytest-gluetool artifacts
.archive_tests:
  variables:
    CI_ARTIFACT_URL_PREFIX_FILE:
      "https://$CI_PAGES_HOSTNAME/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts"
    CI_ARTIFACT_URL_PREFIX_DIR:
      "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/browse"
  artifacts:
    expose_as: report
    paths:
      - report.html
      - assets/style.css
      - .pytest/
      - .direnv/envrc.log
    when: always

ansible-vault:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - dnf -y install ansible-lint
    - >
      ansible-vault view $SECRETS_FILE | yamllint -d "rules: {line-length: {level: warning}}" -
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, secrets]

pre-commit:
  extends: .direnv
  stage: test
  variables:
    # Disable parallelism on all levels to mitigate test flakes
    GOMAXPROCS: 1
    TF_PARALLELISM: 1
    TERRAGRUNT_PARALLELISM: 1
  script:
    - !reference [.direnv, script]
    # Need to init the modules, or pre-commit terragrunt_validate will fail :(
    - make -j4 dev/init staging/init staging/init/ci production/init
    # Check if no changes after init (replacement for unstable terragrunt_validate pre-commit hook)
    - "if ! git diff; then echo 'Error: terragrunt init shows some changes.'; exit 1; fi"
    - pre-commit run --config .pre-commit-config-maintainer.yaml --all-files
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - when: always

test/dev:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    TF_VAR_cluster_name: testing-farm-gitlab-ci-$CI_JOB_ID
    SCRIPT: >-
      make dev/init &&
      make dev/apply &&
      make wait/artemis/dev &&
      make dev/create/public/worker &&
      testing-farm-dev-public-developer request --git-url https://gitlab.com/testing-farm/tests --plan /testing-farm/sanity
    ERROR_SCRIPT: >-
      make dev/kubeconfig &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -A . &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events --all-namespaces -o wide
    AFTER_SCRIPT: make dev/destroy > /dev/null
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, ansible]
    - !reference [.rules, terragrunt_dev]

test/staging/pipeline:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      make staging/apply/ci &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/pipeline/ci
    ERROR_SCRIPT: >-
      make staging/kubeconfig &&
      NAMESPACE="$(env -C terragrunt/environments/staging/ci/artemis terragrunt output --raw namespace)" &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -n "$NAMESPACE" .
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events -n "$NAMESPACE" -o wide
    AFTER_SCRIPT: >-
      make staging/destroy/ci > /dev/null &&
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_pipeline_tests]

test/staging/pipeline/container:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    PYTEST_PARALLEL_RUNS: 1
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/pipeline/container/ci
    AFTER_SCRIPT: >-
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_pipeline_tests]

test/staging/compose:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      make staging/apply/ci &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/compose/ci
    ERROR_SCRIPT: >-
      make staging/kubeconfig &&
      NAMESPACE="$(env -C terragrunt/environments/staging/ci/artemis terragrunt output --raw namespace)" &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -n "$NAMESPACE" .
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events -n "$NAMESPACE" -o wide
    AFTER_SCRIPT: >-
      make staging/destroy/ci > /dev/null &&
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_compose_tests]

test/terraform/modules:
  extends: [.direnv]
  stage: test
  script:
    - dnf -y install golang
    - make test/terraform/modules
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_modules_infra]
    - !reference [.rules, terragrunt_modules_testing_farm]

test/infra:
  extends: .direnv
  stage: test
  # NOTE: run one infra plan or apply at a time, they lock the same Terraform state
  resource_group: infra
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    TERRAGRUNT_PARALLELISM: 3
    SCRIPT: >-
      make infra/init &&
      make infra/plan
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_infra]

test/staging:
  extends: .direnv
  stage: test
  # NOTE: run one staging plan or apply at a time, they lock the same Terraform state
  resource_group: staging
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/plan
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging]

test/production:
  extends: .direnv
  stage: test
  # NOTE: run one production plan or apply at a time, they lock the same Terraform state
  resource_group: production
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make production/plan

  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_production]

test/testing-farm/ranch-redhat:
  stage: test
  image: quay.io/testing-farm/cli:latest
  script:
    # test the worker and citool-config images of the release this branch deploys, never `latest`,
    # `citool_config_release` defaults to the `{{ release }}` template
    - apk add --no-cache yq-go
    - |
      GROUP_VARS=ansible/inventory/group_vars/testing_farm_redhat_workers.yaml
      RELEASE=$(yq '.release' $GROUP_VARS)
      CONFIG_RELEASE=$(yq '(.citool_config_release | select(. != "*{{*")) // .release' $GROUP_VARS)
      echo "Testing worker-redhat:$RELEASE with ranch-redhat:$CONFIG_RELEASE"
    - >
      TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT_ADMIN testing-farm request \
        --git-ref $CI_MERGE_REQUEST_REF_PATH \
        --git-url $CI_MERGE_REQUEST_PROJECT_URL \
        --plan /tests/testing-farm/pytest-gluetool-redhat \
        --secret TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT_ADMIN \
        --environment "EXTRA_TESTING_FARM_ARGS='--worker-image quay.io/testing-farm/worker-redhat:$RELEASE --worker-config-image quay.io/testing-farm/ranch-redhat:$CONFIG_RELEASE'" \
        --skip-summary
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, redhat_pipeline_tests]

redeploy/staging:
  extends: .direnv
  stage: deploy
  # NOTE: run one staging plan or apply at a time, they lock the same Terraform state
  resource_group: staging
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/apply &&
      make staging/destroy &&
      make staging/apply &&
      make wait/artemis/staging &&
      make staging/create/public/worker
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "redeploy/staging"'

cleanup/ci:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: make cleanup/ci
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "cleanup/ci"'

cleanup/dev:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: make dev/destroy/force/all
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "cleanup/dev"'

deploy/infra:
  extends: .direnv
  stage: deploy
  # NOTE: run one infra plan or apply at a time, they lock the same Terraform state
  resource_group: infra
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    TERRAGRUNT_PARALLELISM: 3
    SCRIPT: >-
      make infra/init &&
      make infra/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_infra]

deploy/staging:
  extends: .direnv
  stage: deploy
  # NOTE: run one staging plan or apply at a time, they lock the same Terraform state
  resource_group: staging
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging]

deploy/staging/workers:
  extends: .direnv
  stage: deploy
  resource_group: staging
  # Worker availability must not block production deployment.
  allow_failure: true
  needs:
    - job: deploy/staging
      artifacts: false
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/update/public/pipeline/config &&
      make staging/update/public/pipeline/jobs
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging]

deploy/production:
  extends: .direnv
  stage: deploy
  # NOTE: run one production plan or apply at a time, they lock the same Terraform state
  resource_group: production
  needs:
    # NOTE: prevent artifacts to be copied from dependant jobs, we want a fresh direnv setup here
    - job: deploy/staging
      optional: true
      artifacts: false
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make production/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_production]

update/composes/public:
  extends: .direnv
  stage: deploy
  # Not idempotent: a retry opens a second MR on a new timestamped branch.
  retry: 0
  script:
    - !reference [.direnv, script]
    - make compose/update/public
    - git remote set-url origin https://oauth2:${GITLAB_PRIVATE_TOKEN}@gitlab.com/testing-farm/infrastructure.git
    - gitlab create-merge-request --title="Update public composes $(date -u --rfc-3339=date)"
  rules:
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "compose/update/public"'

renew/certs:
  extends: .direnv
  stage: deploy
  # Not idempotent: a retry requests the certificates again (Let's Encrypt
  # duplicate-certificate limit) and fails to push the existing branch.
  retry: 0
  script:
    - !reference [.direnv, script]
    # Renews the staging and staging-ci Let's Encrypt wildcard certs via DNS-01
    # (Route53) and opens an MR with the re-encrypted vault files. Merge then
    # redeploy staging to bake the new certs into the server ignition.
    - setup/renew_certs.sh
  rules:
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "renew/certs"'

# ---------------------------------------------------------------------------
# RHEL 10 bootc artifact-server image, built on the Testing Farm Red Hat ranch:
# container -> dgoss + qcow2 -> ami. See images/artifacts/README.adoc.
#
# Required CI/CD variables:
#   TESTING_FARM_API_TOKEN_REDHAT  RH ranch token
#   AUTH_JSON_IMAGES_PAAS          masked, base64 auth file with push access to
#                                  images.paas.redhat.com/testingfarm
#   VAULT_SECRET_ID                Vault secret id for the cloud credentials
# ---------------------------------------------------------------------------
.artifacts:
  stage: deploy
  image: quay.io/testing-farm/cli:latest
  variables:
    # image/artifacts/* targets live in Makefile.maintainer
    IS_MAINTAINER: "1"
    ARTIFACTS_IMAGE_REPO: images.paas.redhat.com/testingfarm/artifacts
  before_script:
    - export TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT
  rules:
    # Run when the image sources change (docs excluded). On the default branch
    # only for pushes: 'changes' is always true for schedules and manual runs.
    - if: $CI_MERGE_REQUEST_IID
      changes: &artifacts-changes
        - images/artifacts/Containerfile
        - images/artifacts/*.sh
        - images/artifacts/*.fmf
        - images/artifacts/*.py
        - images/artifacts/*.yaml
        - images/artifacts/build-arg-*
        - images/artifacts/config/**/*
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *artifacts-changes
      when: on_success

image/artifacts/container:
  extends: .artifacts
  needs: []
  script:
    # Every pipeline builds its own tag, so a later pipeline can't swap the image
    # under this one's qcow2. The default branch also tags :latest.
    # TODO: per-pipeline MR tags accumulate in the registry, add a tag-expiry policy.
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        IMAGE_REF="${ARTIFACTS_IMAGE_REPO}:mr-${CI_MERGE_REQUEST_IID}-${CI_PIPELINE_ID}"
        IMAGE_TAGS=""
      else
        IMAGE_REF="${ARTIFACTS_IMAGE_REPO}:${CI_COMMIT_SHORT_SHA}"
        IMAGE_TAGS="latest"
      fi
      echo "[i] IMAGE_REF=$IMAGE_REF IMAGE_TAGS=${IMAGE_TAGS:-<none>}"
    - make image/artifacts/container TARGET_IMAGE="$IMAGE_REF" IMAGE_TAGS="$IMAGE_TAGS"
    - echo "IMAGE_REF=$IMAGE_REF" > image.env
  artifacts:
    reports:
      dotenv: image.env

image/artifacts/dgoss:
  extends: .artifacts
  needs:
    - job: image/artifacts/container
      optional: true
      artifacts: true
  script:
    - make image/artifacts/dgoss IMAGE="${IMAGE_REF:-$ARTIFACTS_IMAGE_REPO:latest}" | tee dgoss.log
    # A request that discovers zero tests ends "skipped" and the CLI still exits 0,
    # so fail unless the request result is "passed".
    - |
      # grep -m1, not '| head -1': head exiting early can SIGPIPE grep under pipefail.
      api_url=$(grep -m1 -oE 'https://[^ ]+/requests/[0-9a-f-]{36}' dgoss.log || true)
      [ -n "$api_url" ] || { echo "[E] could not find the testing-farm request URL in the dgoss output"; exit 1; }
      # The cli image has python3 but no curl.
      overall=$(python3 -c 'import sys, json, urllib.request; print((json.load(urllib.request.urlopen(sys.argv[1], timeout=30)).get("result") or {}).get("overall", ""))' "$api_url")
      echo "[i] dgoss request overall result: ${overall:-<none>}"
      [ "$overall" = "passed" ] || { echo "[E] dgoss did not pass (overall='${overall:-<none>}')"; exit 1; }

image/artifacts/qcow2:
  extends: .artifacts
  needs:
    - job: image/artifacts/container
      optional: true
      artifacts: true
  script:
    # Record the build request id for the ami job. A preset QCOW2_REQUEST or
    # QCOW2_URL skips the build.
    - |
      if [ -z "${QCOW2_REQUEST:-}" ] && [ -z "${QCOW2_URL:-}" ]; then
        make image/artifacts/qcow2 IMAGE="${IMAGE_REF:-$ARTIFACTS_IMAGE_REPO:latest}" | tee qcow2-build.log
        QCOW2_REQUEST=$(grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' qcow2-build.log || true)
        [ -n "$QCOW2_REQUEST" ] || { echo "[E] could not find the build request id in the qcow2 build output."; exit 1; }
      fi
    - |
      : > qcow2.env
      if [ -n "${QCOW2_REQUEST:-}" ]; then echo "QCOW2_REQUEST=${QCOW2_REQUEST}" >> qcow2.env; fi
      if [ -n "${QCOW2_URL:-}" ]; then echo "QCOW2_URL=${QCOW2_URL}" >> qcow2.env; fi
      cat qcow2.env
  artifacts:
    reports:
      dotenv: qcow2.env

image/artifacts/ami:
  extends: .artifacts
  needs:
    - job: image/artifacts/qcow2
      optional: true
      artifacts: true
    # Publish only images that passed the container checks.
    - job: image/artifacts/dgoss
      optional: true
  variables:
    QCOW2_ARCH: x86_64
  script:
    # tft-admin no-ops on an existing name, so every upload gets a unique one. MRs
    # upload a throwaway AMI, the default branch an immutable per-commit AMI the
    # deploy picks by name.
    - |
      [ -n "${QCOW2_REQUEST:-}" ] || [ -n "${QCOW2_URL:-}" ] || { echo "[E] neither QCOW2_REQUEST nor QCOW2_URL is set"; exit 1; }
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        IMAGE_NAME="artifacts-bootc-${QCOW2_ARCH}-mr-${CI_MERGE_REQUEST_IID}-${CI_PIPELINE_ID}"
        REMOVE_AFTER_TEST=1
      else
        IMAGE_NAME="artifacts-bootc-${QCOW2_ARCH}-${CI_COMMIT_SHORT_SHA}"
        REMOVE_AFTER_TEST=""
      fi
      make image/artifacts/ami IMAGE_NAME="$IMAGE_NAME" REMOVE_AFTER_TEST="$REMOVE_AFTER_TEST"
