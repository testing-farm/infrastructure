---
default:
  image: quay.io/testing-farm/python-ci-image:latest

variables:
  # GitLab CI runs in world writable directory, we need to explicitely set ANSIBLE_CONFIG
  # https://docs.ansible.com/ansible/devel/reference_appendices/config.html#cfg-in-world-writable-dir
  ANSIBLE_CONFIG: ansible.cfg
  # Used only for staging/ci environment, no-op for others
  STAGING_CI_SUFFIX: $CI_MERGE_REQUEST_ID-$CI_JOB_ID
  # Set USER used to derive certain dev environment resource names
  USER: gitlab-ci-$CI_JOB_ID

workflow:
  rules:
    # for merge requests
    - if: $CI_MERGE_REQUEST_ID
    # for the tip of the default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # for schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"

.rules:
  not_default_branch:
    # do not run for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never

  not_schedule:
    # do not run for schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

  only_default_branch:
    # run only for default branch
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never

  only_schedule:
    # run only for schedule
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: never

  gitlab_ci:
    - changes:
        - .gitlab-ci.yml

  secrets:
    - changes:
        - ansible/secrets/credentials.yaml

  infrastructure:
    - !reference [.rules, secrets]
    - !reference [.rules, gitlab_ci]
    - changes:
        - .envrc
        - poetry.lock
        - Makefile*
        - setup/*

  ansible:
    - changes:
        - ansible/files/**/*
        - ansible/inventory/**/*
        - ansible/requirements.yaml
        - ansible/roles/**/*
        - ansible/tasks/**/*
        - ansible/vars/**/*

  terragrunt_modules_infra:
    - changes:
        - terragrunt/modules/gitlab/**/*

  terragrunt_modules_testing_farm:
    - changes:
        - terragrunt/modules/artemis/**/*
        - terragrunt/modules/eks/**/*
        - terragrunt/modules/localhost/**/*
        - terragrunt/modules/vault/**/*
        - terragrunt/modules/worker/**/*

  terragrunt_infra:
    - !reference [.rules, infrastructure]
    - !reference [.rules, terragrunt_modules_infra]
    - changes:
        - terragrunt/environments/infra/**/*

  terragrunt_testing_farm:
    - !reference [.rules, infrastructure]
    - !reference [.rules, terragrunt_modules_testing_farm]

  terragrunt_dev:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        # NOTE: need to be explicit here, no nice excludes supported yet
        # We do not run this when variables-composes changed for example
        # https://gitlab.com/gitlab-org/gitlab/-/issues/198688
        #
        # NOTE: we do not want this run on config changes, validation is done against staging
        - terragrunt/environments/dev/*/terragrunt.hcl
        - terragrunt/environments/dev/artemis/**/*
        - terragrunt/environments/dev/server/**/*
        - terragrunt/environments/dev/worker-public/jobs/**/*

  terragrunt_staging:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        - terragrunt/environments/staging/**/*

  terragrunt_staging_ci:
    - !reference [.rules, terragrunt_testing_farm]
    - changes:
        # The staging-ci environment sources its config from these shared
        # staging dirs (e.g. ci/server symlinks to ../../server), so changes
        # there must trigger the staging-ci integration tests too.
        - terragrunt/environments/staging/artemis/**/*
        - terragrunt/environments/staging/server/**/*
        - terragrunt/environments/staging/worker-local/**/*

  terragrunt_production:
    - !reference [.rules, infrastructure]
    - changes:
        - terragrunt/environments/production/**/*

  public_compose_tests:
    - changes:
        - tests/worker/public/compose*

  public_pipeline_tests:
    - changes:
        - tests/worker/base-scenarios/*
        - tests/worker/public/tmt*
        - tests/worker/public/sti*

  redhat_pipeline_tests:
    - changes:
        - tests/testing-farm/base-scenarios/**/*
        - tests/testing-farm/redhat/**/*

direnv:
  stage: test
  before_script:
    - dnf -y install direnv libffi libffi-devel yq
    - echo -n "$VAULT_PASSWORD" > .vault_pass
  script:
    - direnv allow
    - eval "$(direnv export bash)"
    - make generate/staging/citool-config
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]

.direnv:
  before_script:
    - dnf -y install direnv libffi libffi-devel podman rsync awk yq
    - echo -n "$VAULT_PASSWORD" > .vault_pass
    - poetry env use python3.12
    - direnv allow
    - eval "$(direnv export bash)"
  script:
    - eval "$(direnv export bash)"
  artifacts:
    paths:
      - .direnv/envrc.log
    when: always

# Workaround for after_script timing-out
.script_with_cleanup:
  script:
    - /bin/bash -c "${SCRIPT}" && EXIT_CODE=$? || EXIT_CODE=$?
    - if [ ${EXIT_CODE} -ne 0 ] && [ -n "$ERROR_SCRIPT" ]; then /bin/bash -c "${ERROR_SCRIPT}" || true; fi
    - /bin/bash -c "${AFTER_SCRIPT}"
    - "[ ${EXIT_CODE} = 0 ]"

# Archive pytest-gluetool artifacts
.archive_tests:
  variables:
    CI_ARTIFACT_URL_PREFIX_FILE:
      "https://$CI_PAGES_HOSTNAME/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts"
    CI_ARTIFACT_URL_PREFIX_DIR:
      "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/browse"
  artifacts:
    expose_as: report
    paths:
      - report.html
      - assets/style.css
      - .pytest/
      - .direnv/envrc.log
    when: always

ansible-vault:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - dnf -y install ansible-lint
    - >
      ansible-vault view $SECRETS_FILE | yamllint -d "rules: {line-length: {level: warning}}" -
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, secrets]

pre-commit:
  extends: .direnv
  stage: test
  variables:
    # Disable parallelism on all levels to mitigate test flakes
    GOMAXPROCS: 1
    TF_PARALLELISM: 1
    TERRAGRUNT_PARALLELISM: 1
  script:
    - !reference [.direnv, script]
    # Need to init the modules, or pre-commit terragrunt_validate will fail :(
    - make -j4 dev/init staging/init staging/init/ci production/init
    # Check if no changes after init (replacement for unstable terragrunt_validate pre-commit hook)
    - "if ! git diff; then echo 'Error: terragrunt init shows some changes.'; exit 1; fi"
    - pre-commit run --config .pre-commit-config-maintainer.yaml --all-files
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - when: always

test/dev:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    TF_VAR_cluster_name: testing-farm-gitlab-ci-$CI_JOB_ID
    SCRIPT: >-
      make dev/init &&
      make dev/apply &&
      make wait/artemis/dev &&
      make dev/create/public/worker &&
      testing-farm-dev-public-developer request --git-url https://gitlab.com/testing-farm/tests --plan /testing-farm/sanity
    ERROR_SCRIPT: >-
      make dev/kubeconfig &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -A . &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events --all-namespaces -o wide
    AFTER_SCRIPT: make dev/destroy > /dev/null
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, ansible]
    - !reference [.rules, terragrunt_dev]

test/staging/pipeline:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      make staging/apply/ci &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/pipeline/ci
    ERROR_SCRIPT: >-
      make staging/kubeconfig &&
      NAMESPACE="$(env -C terragrunt/environments/staging/ci/artemis terragrunt output --raw namespace)" &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -n "$NAMESPACE" .
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events -n "$NAMESPACE" -o wide
    AFTER_SCRIPT: >-
      make staging/destroy/ci > /dev/null &&
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_pipeline_tests]

test/staging/pipeline/container:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    PYTEST_PARALLEL_RUNS: 1
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/pipeline/container/ci
    AFTER_SCRIPT: >-
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_pipeline_tests]

test/staging/compose:
  extends: [.direnv, .archive_tests]
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      git clone https://gitlab.com/testing-farm/profiles &&
      ANSIBLE_COLLECTIONS_PATH=/etc/testing-farm/profiles make -C profiles install/local &&
      make staging/apply/ci &&
      PYTEST_OPTIONS="--profiles /etc/testing-farm/profiles" make test/staging/compose/ci
    ERROR_SCRIPT: >-
      make staging/kubeconfig &&
      NAMESPACE="$(env -C terragrunt/environments/staging/ci/artemis terragrunt output --raw namespace)" &&
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Container Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl stern --no-follow --tail 100 -n "$NAMESPACE" .
      echo &&
      echo "==============================================" &&
      echo "==   Kubernetes Event Logs" &&
      echo "==============================================" &&
      echo &&
      kubectl get events -n "$NAMESPACE" -o wide
    AFTER_SCRIPT: >-
      make staging/destroy/ci > /dev/null &&
      make test/pytest/oculus
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging_ci]
    - !reference [.rules, public_compose_tests]

test/terraform/modules:
  extends: [.direnv]
  stage: test
  script:
    - dnf -y install golang
    - make test/terraform/modules
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_modules_infra]
    - !reference [.rules, terragrunt_modules_testing_farm]

test/infra:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    TERRAGRUNT_PARALLELISM: 3
    SCRIPT: >-
      make infra/init &&
      make infra/plan
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_infra]

test/staging:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/plan
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging]

test/production:
  extends: .direnv
  stage: test
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make production/plan

  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_production]

test/testing-farm/ranch-redhat:
  stage: test
  image: quay.io/testing-farm/cli:latest
  script:
    - >
      TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT_ADMIN testing-farm request \
        --git-ref $CI_MERGE_REQUEST_REF_PATH \
        --git-url $CI_MERGE_REQUEST_PROJECT_URL \
        --plan /tests/testing-farm/pytest-gluetool-redhat \
        --secret TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT_ADMIN \
        --environment "EXTRA_TESTING_FARM_ARGS='--worker-config-image quay.io/testing-farm/ranch-redhat:latest'" \
        --skip-summary
  rules:
    - !reference [.rules, not_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, redhat_pipeline_tests]

redeploy/staging:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/apply &&
      make staging/destroy &&
      make staging/apply &&
      make wait/artemis/staging &&
      make staging/create/public/worker
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "redeploy/staging"'

cleanup/ci:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: make cleanup/ci
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "cleanup/ci"'

cleanup/dev:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: make dev/destroy/force/all
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "cleanup/dev"'

deploy/infra:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make infra/init &&
      make infra/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_infra]

deploy/staging:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make staging/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_staging]

deploy/production:
  extends: .direnv
  stage: deploy
  needs:
    # NOTE: prevent artifacts to be copied from dependant jobs, we want a fresh direnv setup here
    - job: deploy/staging
      optional: true
      artifacts: false
  script:
    - !reference [.direnv, script]
    - !reference [.script_with_cleanup, script]
  variables:
    SCRIPT: >-
      make production/apply
  rules:
    - !reference [.rules, only_default_branch]
    - !reference [.rules, not_schedule]
    - !reference [.rules, terragrunt_production]

update/composes/public:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    - make compose/update/public
    - git remote set-url origin https://oauth2:${GITLAB_PRIVATE_TOKEN}@gitlab.com/testing-farm/infrastructure.git
    - gitlab create-merge-request --title="Update public composes $(date -u --rfc-3339=date)"
  rules:
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "compose/update/public"'

renew/certs:
  extends: .direnv
  stage: deploy
  script:
    - !reference [.direnv, script]
    # Renews the staging and staging-ci Let's Encrypt wildcard certs via DNS-01
    # (Route53) and opens an MR with the re-encrypted vault files. Merge then
    # redeploy staging to bake the new certs into the server ignition.
    - setup/renew_certs.sh
  rules:
    - !reference [.rules, only_schedule]
    - if: '$SCHEDULED_JOB == "renew/certs"'

# ---------------------------------------------------------------------------
# RHEL 10 bootc artifact-server image (TFT-4795)
#
# A 'needs'-ordered chain run on Testing Farm from the public cli image:
# container -> dgoss + qcow2 -> ami, plus merge-guard. Each job documents its
# step; see images/artifacts/README.adoc for the whole flow.
#
# Required CI/CD variables:
#   TESTING_FARM_API_TOKEN_REDHAT  RH ranch token (entitled RHEL bootc base)
#   AUTH_JSON                      masked, base64 auth file with push access to
#                                  images.paas.redhat.com/testingfarm
#   VAULT_SECRET_ID                Vault secret id for the cloud credentials
# ---------------------------------------------------------------------------
.artifacts-bootc:
  stage: deploy
  image: quay.io/testing-farm/cli:latest
  variables:
    # image/artifacts-bootc/* targets live in Makefile.maintainer
    IS_MAINTAINER: "1"
    # Same internal registry as the rhel-bootc base image
    ARTIFACTS_IMAGE_REPO: images.paas.redhat.com/testingfarm/artifacts-bootc
  before_script:
    - export TESTING_FARM_API_TOKEN=$TESTING_FARM_API_TOKEN_REDHAT
  rules:
    # Run the build chain (container -> qcow2 -> ami, ordered by 'needs') whenever the
    # image *sources* change - on MRs to validate before merge, and on the default
    # branch after merge to publish the per-commit AMI. Docs (README.adoc) are
    # excluded so they do not trigger a ~30-min build and a kept AMI; the glob list is
    # everything under the dir except docs (GitLab 'changes' has no exclusion syntax).
    # The default branch rule is push-only: 'changes' is always true for pipelines
    # without a push event (schedules, "Run pipeline"), which would publish an AMI
    # on every scheduled run. The ami job picks the AMI name per context (see
    # image/artifacts-bootc/ami).
    - if: $CI_MERGE_REQUEST_IID
      changes: &artifacts-bootc-changes
        - images/artifacts/Containerfile
        - images/artifacts/*.sh
        - images/artifacts/*.fmf
        - images/artifacts/*.py
        - images/artifacts/*.yaml
        - images/artifacts/build-arg-*
        - images/artifacts/config/**/*
        - images/artifacts/upload-qcow2/**/*
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *artifacts-bootc-changes
      when: on_success

image/artifacts-bootc/merge-guard:
  extends: .artifacts-bootc
  needs: []
  script:
    # Fails the pipeline while a temporary "do not merge" marker is present (e.g.
    # the MR-AMI change in the ami job), so it cannot be merged unaddressed.
    - bash images/artifacts/merge-guard.sh

image/artifacts-bootc/container:
  extends: .artifacts-bootc
  needs: []
  script:
    # Tag MR builds per pipeline so they never overwrite the production :latest and
    # never race another pipeline; the default branch still publishes :latest. The
    # tag is recorded in a dotenv artifact so the qcow2 job builds from this exact
    # image.
    # TODO(TFT-4795): per-pipeline MR tags accumulate in the registry - add a tag-expiry
    # policy or a prune step (same cleanup gap as the per-pipeline AMIs).
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        IMAGE_REF="${ARTIFACTS_IMAGE_REPO}:mr-${CI_MERGE_REQUEST_IID}-${CI_PIPELINE_ID}"
      else
        IMAGE_REF="${ARTIFACTS_IMAGE_REPO}:latest"
      fi
      echo "[i] IMAGE_REF=$IMAGE_REF"
    # The make target passes AUTH_JSON (masked CI/CD variable) as a Testing Farm secret.
    - make image/artifacts-bootc/container TARGET_IMAGE="$IMAGE_REF"
    - echo "IMAGE_REF=$IMAGE_REF" > image.env
  artifacts:
    reports:
      dotenv: image.env

image/artifacts-bootc/dgoss:
  extends: .artifacts-bootc
  needs:
    - job: image/artifacts-bootc/container
      optional: true
      artifacts: true
  script:
    # The per-pipeline image lives in a private repository, so dgoss pulls it with
    # AUTH_JSON (the make target passes it as a secret). dgoss fetches the goss file
    # over HTTP, so also pass a raw URL at this commit (so an MR tests its own goss).
    - |
      GOSS_YAML="${CI_PROJECT_URL}/-/raw/${CI_COMMIT_SHA}/images/artifacts/goss.yaml"
      make image/artifacts-bootc/dgoss IMAGE="${IMAGE_REF:-$ARTIFACTS_IMAGE_REPO:latest}" GOSS_YAML="$GOSS_YAML" | tee dgoss.log
    # Guard: a request that discovers zero tests finishes "skipped" but the CLI
    # still exits 0, so the gate would pass without running goss. Query the request
    # result and fail unless it actually passed (also catches a future discovery
    # regression).
    - |
      # grep -m1, not '| head -1': busybox grep writes each match separately, so
      # head exiting early can SIGPIPE grep and fail the job under pipefail.
      api_url=$(grep -m1 -oE 'https://[^ ]+/requests/[0-9a-f-]{36}' dgoss.log || true)
      [ -n "$api_url" ] || { echo "[E] could not find the testing-farm request URL in the dgoss output"; exit 1; }
      # Use urllib, not curl (the cli image has python3 but no curl).
      overall=$(python3 -c 'import sys, json, urllib.request; print((json.load(urllib.request.urlopen(sys.argv[1], timeout=30)).get("result") or {}).get("overall", ""))' "$api_url")
      echo "[i] dgoss request overall result: ${overall:-<none>}"
      [ "$overall" = "passed" ] || { echo "[E] dgoss did not pass (overall='${overall:-<none>}') - skipped / zero tests / failed"; exit 1; }

image/artifacts-bootc/qcow2:
  extends: .artifacts-bootc
  needs:
    - job: image/artifacts-bootc/container
      optional: true
      artifacts: true
  script:
    # Build the qcow2 and record the build request id for the ami job (handed on via
    # the dotenv artifact below). The download URL is NOT derived here: the runner
    # cannot reach the Red Hat ranch artifact server; the ami job's upload plan
    # derives it inside Testing Farm. A preset QCOW2_REQUEST or QCOW2_URL takes
    # precedence over building.
    - |
      if [ -z "${QCOW2_REQUEST:-}" ] && [ -z "${QCOW2_URL:-}" ]; then
        make image/artifacts-bootc/qcow2 IMAGE="${IMAGE_REF:-$ARTIFACTS_IMAGE_REPO:latest}" | tee qcow2-build.log
        # The log has the request id twice; grep -m1 avoids the '| head -1' SIGPIPE
        # race (see the dgoss job), and '|| true' lets the [E] check below report it.
        QCOW2_REQUEST=$(grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' qcow2-build.log || true)
        [ -n "$QCOW2_REQUEST" ] || { echo "[E] could not find the build request id in the qcow2 build output."; exit 1; }
      fi
    - |
      : > qcow2.env
      if [ -n "${QCOW2_REQUEST:-}" ]; then echo "QCOW2_REQUEST=${QCOW2_REQUEST}" >> qcow2.env; fi
      if [ -n "${QCOW2_URL:-}" ]; then echo "QCOW2_URL=${QCOW2_URL}" >> qcow2.env; fi
      cat qcow2.env
  artifacts:
    reports:
      dotenv: qcow2.env

image/artifacts-bootc/ami:
  extends: .artifacts-bootc
  needs:
    - job: image/artifacts-bootc/qcow2
      optional: true
      artifacts: true
    # Gate the publish on the container checks; dgoss runs parallel to qcow2 so this
    # adds no wall-clock.
    - job: image/artifacts-bootc/dgoss
      optional: true
  variables:
    QCOW2_ARCH: x86_64
  # QCOW2_REQUEST is inherited from the qcow2 job's dotenv artifact; the upload plan
  # derives the download URL from it inside Testing Farm (the runner cannot reach the
  # artifact server). Set QCOW2_REQUEST manually to point at a different build, or
  # QCOW2_URL to skip derivation with a ready URL. VAULT_SECRET_ID must be set as a
  # CI/CD variable.
  script:
    - |
      [ -n "${QCOW2_REQUEST:-}" ] || [ -n "${QCOW2_URL:-}" ] || { echo "[E] neither QCOW2_REQUEST nor QCOW2_URL is set - run the qcow2 job first or set one manually."; exit 1; }
      # Always upload under a unique name (tft-admin no-ops on an existing name, so a
      # reused name would keep a stale image). MRs upload a throwaway per-pipeline AMI;
      # the default branch uploads an immutable per-commit AMI the deploy (TFT-4797)
      # pins - never deleted or overwritten in place.
      # TODO(TFT-4795) MERGE-BLOCKER: REMOVE_AFTER_TEST is intentionally NOT set on
      # MRs for now, so reviewers can boot-test the MR's AMI (it is deleted
      # otherwise). These MR AMIs accumulate, so before merge either re-enable
      # cleanup here or add a prune, then remove this marker. Enforced by the
      # image/artifacts-bootc/merge-guard job.
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        IMAGE_NAME="artifacts-bootc-${QCOW2_ARCH}-mr-${CI_MERGE_REQUEST_IID}-${CI_PIPELINE_ID}"
        REMOVE_AFTER_TEST=""
      else
        IMAGE_NAME="artifacts-bootc-${QCOW2_ARCH}-${CI_COMMIT_SHORT_SHA}"
        REMOVE_AFTER_TEST=""
      fi
      echo "[i] IMAGE_NAME=$IMAGE_NAME REMOVE_AFTER_TEST=${REMOVE_AFTER_TEST:-<unset>}"
      set -- --skip-summary -e IMAGE_NAME="$IMAGE_NAME" -e QCOW2_ARCH="$QCOW2_ARCH" -s VAULT_SECRET_ID="$VAULT_SECRET_ID" --plan /images/artifacts/upload
      if [ -n "$REMOVE_AFTER_TEST" ]; then set -- "$@" -e REMOVE_AFTER_TEST="$REMOVE_AFTER_TEST"; fi
      if [ -n "${QCOW2_REQUEST:-}" ]; then set -- "$@" -e QCOW2_REQUEST="$QCOW2_REQUEST"; fi
      if [ -n "${QCOW2_URL:-}" ]; then set -- "$@" -e QCOW2_URL="$QCOW2_URL"; fi
      testing-farm request "$@"
      # Surface the uploaded AMI name so the deploy (TFT-4797) can pin it.
      echo "AMI_NAME=$IMAGE_NAME" > ami.env
  artifacts:
    reports:
      dotenv: ami.env
