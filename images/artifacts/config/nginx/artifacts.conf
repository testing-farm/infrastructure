# Artifact storage server, serving the read-only S3 Files mount.

# Show the directory listing instead of index.html when ?list=true is given.
map $arg_list $artifacts_index {
    default  index.html;
    true     THIS_DOES_NOT_EXIST;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name redhat.artifacts.testing.farm;

    # SSL certificates
    ssl_certificate     /etc/pki/nginx/artifacts.crt;
    ssl_certificate_key /etc/pki/nginx/artifacts.key;

    root /var/mnt/artifacts;

    # Allow cross-origin web requests (useful when testing Oculus).
    add_header Access-Control-Allow-Origin *;

    location ~ "^.*citool-debug.*$" {
        return 404;
    }

    location / {
        autoindex on;
        index $artifacts_index;
    }

    # Serve pre-compressed logs and data as gzipped text, so browsers render them
    # instead of downloading.
    location ~ \.(txt|log|json|xml|yaml)\.gz$ {
        types { } default_type "text/plain";
        add_header Access-Control-Allow-Origin *;
        add_header Content-Encoding gzip;
    }
}
