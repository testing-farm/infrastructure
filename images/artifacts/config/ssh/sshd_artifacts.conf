# Restricted upload access for the artifacts rrsync key. TFT-4795.
#
# The upload key (in /etc/ssh/artifacts_authorized_keys) is pinned to an rrsync
# forced command in that file, so it is write-restricted to /mnt/s3files with no
# shell. This block hardens the account further.
Match User artifacts
    AuthorizedKeysFile /etc/ssh/artifacts_authorized_keys
    PasswordAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
