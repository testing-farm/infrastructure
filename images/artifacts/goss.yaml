---
# Container-scope checks: image contents only, run by the dgoss plan. dgoss
# starts the image as a container, so it cannot verify running services, the real
# NFS mount, listening ports or kargs - those live in goss-vm.yaml.
package:
  nginx:
    installed: true
  openssh-server:
    installed: true
  stunnel:
    installed: true
  nfs-utils:
    installed: true
  amazon-efs-utils:
    installed: true

file:
  /usr/local/libexec/check-artifacts-mount:
    exists: true
    mode: "0755"
  /usr/local/libexec/mount-artifacts-storage:
    exists: true
    mode: "0755"
  /etc/yum.repos.d/efs-utils.repo:
    exists: true
  /etc/nginx/nginx.conf:
    exists: true
  /etc/nginx/conf.d/artifacts.conf:
    exists: true
  /usr/lib/systemd/system/nginx.service.d/10-storage.conf:
    exists: true
  # Storage is mounted at boot from EC2 user data, not baked into the image.
  /usr/lib/systemd/system/artifacts-storage.service:
    exists: true
    contains:
      - "EnvironmentFile=/etc/sysconfig/artifacts-storage"
      - "ExecStart=/usr/local/libexec/mount-artifacts-storage"
  /usr/lib/sysctl.d/90-artifacts.conf:
    exists: true
  /usr/lib/bootc/kargs.d/90-artifacts.toml:
    exists: true
  /etc/pki/nginx/artifacts.crt:
    exists: true
  /etc/pki/nginx/artifacts.key:
    exists: true
    mode: "0600"
  /var/mnt/s3files:
    exists: true
    filetype: directory
  # Enablement symlinks: systemd is not running under dgoss, so assert the
  # symlinks `systemctl enable` wrote rather than service state.
  /etc/systemd/system/multi-user.target.wants/nginx.service:
    exists: true
    filetype: symlink
  /etc/systemd/system/multi-user.target.wants/sshd.service:
    exists: true
    filetype: symlink
  /etc/systemd/system/multi-user.target.wants/artifacts-storage.service:
    exists: true
    filetype: symlink
