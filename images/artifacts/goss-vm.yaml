---
# Booted-VM checks: runtime behaviour on the installed qcow2/AMI, run against a
# booted guest (not dgoss). Verifies storage is actually mounted and the server
# is live - the things the container-scope goss.yaml cannot see.
service:
  nginx:
    enabled: true
    running: true
  sshd:
    enabled: true
    running: true
  artifacts:
    enabled: true
    running: true

mount:
  /var/mnt/artifacts:
    exists: true
    filesystem: nfs4
    opts:
      contain-element: ro

port:
  tcp:22:
    listening: true
  tcp:80:
    listening: true
  tcp:443:
    listening: true

kernel-param:
  net.ipv4.tcp_congestion_control:
    value: bbr
  net.core.default_qdisc:
    value: fq
  net.core.somaxconn:
    value: "4096"
  sunrpc.tcp_slot_table_entries:
    value: "128"

command:
  # Succeeds only when the storage is mounted.
  /usr/local/libexec/check-artifacts-mount /var/mnt/artifacts:
    exit-status: 0
  # kargs from /usr/lib/bootc/kargs.d/ are applied at boot.
  cat /proc/cmdline:
    exit-status: 0
    stdout:
      - transparent_hugepage=madvise

http:
  # Self-signed placeholder cert until the deploy installs the real one. The
  # storage root has no index.html, so nginx lists it.
  https://localhost/:
    status: 200
    allow-insecure: true
