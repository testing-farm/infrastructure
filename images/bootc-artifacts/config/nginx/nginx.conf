# Artifact storage server nginx.conf. TFT-4795.
# Replaces the stock config so there is no distro default server competing for
# :80 (which caused "conflicting server name" at build time). Our server blocks
# live in conf.d/artifacts.conf.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/conf.d/*.conf;
}
