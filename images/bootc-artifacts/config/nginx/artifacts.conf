# Artifact storage server - nginx autoindex over the S3 Files mount.
# TFT-4795. See TFT-4606 for the full plan.

# Serve pre-compressed logs/text/json as text/plain with gzip encoding so
# browsers render them inline instead of downloading.
map $uri $artifacts_gzip_type {
    default        "";
    ~\.txt\.gz$    "text/plain";
    ~\.log\.gz$    "text/plain";
    ~\.json\.gz$   "text/plain";
}

# HTTP -> HTTPS 301 redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name redhat.artifacts.testing.farm;

    # TLS material is provisioned on the host (TFT-4797); paths are the deploy
    # contract, certs are not baked into the image.
    ssl_certificate     /etc/pki/nginx/artifacts.crt;
    ssl_certificate_key /etc/pki/nginx/artifacts.key;

    root /mnt/s3files;

    # Directory listing.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Allow cross-origin web requests (results viewers fetch artifacts).
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location / {
        # Serve *.txt.gz / *.log.gz / *.json.gz as inline gzipped text.
        if ($artifacts_gzip_type) {
            add_header Content-Encoding gzip always;
            add_header Access-Control-Allow-Origin "*" always;
            default_type $artifacts_gzip_type;
        }
        try_files $uri $uri/ =404;
    }
}
