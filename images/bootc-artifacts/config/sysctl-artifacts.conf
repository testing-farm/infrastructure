# Network/kernel tuning for the artifact storage server. TFT-4795 / TFT-4606.
# High-throughput nginx serving + NFS-over-S3 mount on a c6in.2xlarge.

# BBR congestion control + fq qdisc (bbrfq).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP buffers (min default max).
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# Connection backlog.
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384

# File descriptors.
fs.file-max = 2097152

# NFS/sunrpc RPC slot table for the S3 Files mount throughput.
sunrpc.tcp_slot_table_entries = 128
sunrpc.tcp_max_slot_table_entries = 128
