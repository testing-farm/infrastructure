***REMOVED***
#
# Various workarounds related to beaker-client repository
#
- name: Set required variables
  set_fact:
    beaker_client_repo_file: "/etc/yum.repos.d/beaker-client.repo"

- name: Check if beaker_client repo file exists
  stat:
    path: "{{ beaker_client_repo_file }}"
  register: beaker_client_repo_file_status

- block:
***REMOVED***
***REMOVED*** This workaround is here for the case when beaker-client repository
***REMOVED*** is unavailable. Some images require this repository to be available,
***REMOVED*** make sure we make it optional everywhere.
***REMOVED***
***REMOVED*** Added during October 2021 outage, see TFT-765 for more information.
***REMOVED***
    - name: Set beaker-client repository as optional (skip_if_unavailable=1)
      ini_file:
        path: "{{ beaker_client_repo_file }}"
        section: beaker-client
        option: skip_if_unavailable
        value: "1"

***REMOVED***
***REMOVED*** Some of the images are using decomissioned download.eng.bos.redhat.com.
***REMOVED*** Use download.devel.redhat.com instead.
***REMOVED***
***REMOVED*** Added during October 2025 outage, see TFT-3926 for more information.
***REMOVED***
    - name: Fix beaker-client repository if using decomissioned download.eng.bos.redhat.com
      replace:
        path: "{{ beaker_client_repo_file }}"
        regexp: '(.*)download\.eng\.bos\.redhat\.com(.*)'
        replace: '\1download.devel.redhat.com\2'

  #
  # Run block only if file exists
  #
  when:
    - beaker_client_repo_file_status.stat.exists
    - '"auto-osbuild" not in IMAGE_NAME|lower'
    - '"composer-api" not in IMAGE_NAME|lower'
    - '"hardened" not in IMAGE_NAME|lower'

#
# Be verbose about the fact we skipped the workaround
#
- debug:
    msg: "Skipping workaround, because beaker_client_repo_file does not exist"
  when:
    - not beaker_client_repo_file_status.stat.exists
    - '"auto-osbuild" in IMAGE_NAME|lower'
    - '"composer-api" in IMAGE_NAME|lower'
    - '"hardened" in IMAGE_NAME|lower'
