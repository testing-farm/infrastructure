---
- name: Check for the standalone Python runtime
  ansible.builtin.raw: "test -x {{ python_install_path }}/bin/python3"
  register: _standalone_python
  changed_when: false
  failed_when: false

- name: Override Python runtime for the Ansible target
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ python_install_path }}/bin/python3"
  when: _standalone_python.rc == 0
