---
# This task needs to be separated because gathering facts would try to use
# a wrong python before we can set the standalone one.
- hosts: all
  gather_facts: false
  tasks:
    - include_tasks: set-python.yaml
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
        - '"image-mode" not in IMAGE_NAME|lower'

- hosts: all
  tasks:
    - include_tasks: update-from-artifacts.yaml
      when:
        - UPDATE_FROM_ARTIFACTS
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
        - '"ostree" not in IMAGE_NAME|lower'
        - '"image-mode" not in IMAGE_NAME|lower'
    # Buildroot is needed only to install the artifacts, tests must not see it
    # https://redhat.atlassian.net/browse/TFT-5133
    - include_tasks: disable-buildroot.yaml
