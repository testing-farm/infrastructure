- hosts: all
  vars:
    pkg_retry_count: 5
    pkg_retry_delay: 30
  module_defaults:
    ansible.builtin.package:
      use: "{{ _pkg_module | default('auto') }}"
  tasks:
    - name: testing_farm_profiles.library.update_and_reboot
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
        - '"eln" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.library.update_and_reboot
      vars:
        # Bare metal guests power-cycle the platform on reboot, firmware POST alone
        # takes up to ~820 seconds on the older instance generations in our pools
        update_and_reboot_task_reboot_timeout: 1200
    - name: testing_farm_profiles.library.fedora
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.library.fedora
    - name: testing_farm_profiles.workarounds.centos_eol
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.workarounds.centos_eol
    - name: testing_farm_profiles.workarounds.dns
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.workarounds.dns
    - name: testing_farm_profiles.repository.crb
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.repository.crb
    - name: testing_farm_profiles.repository.epel
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.repository.epel
    - name: testing_farm_profiles.library.beakerlib
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.library.beakerlib
    - name: testing_farm_profiles.library.koji
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.library.koji
    # For EOL distros this can fail, ignore the fact tag repo is not around
    # It is considered a nice to have, but should not fail the setup.
    - name: testing_farm_profiles.repository.tag_repository
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.repository.tag_repository
      ignore_errors: true
    - name: testing_farm_profiles.library.time
      when:
        - '"auto-osbuild" not in IMAGE_NAME|lower'
        - '"pfmt" not in IMAGE_NAME|lower'
      ansible.builtin.include_role:
        name: testing_farm_profiles.library.time
      vars:
        # https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configure-ec2-ntp.html
        time_ntp_server: 169.254.169.123
