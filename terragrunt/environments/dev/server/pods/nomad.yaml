apiVersion: v1
kind: Pod
metadata:
  annotations:
    bind-mount-options: /etc/***REMOVED***Z
  labels:
    app: nomad
  name: nomad
spec:
  containers:
    - name: nginx
      image: quay.io/testing-farm/***REMOVED***latest
      args:
        - agent
        - -config=/etc/nomad/server.conf
      ports:
        - containerPort: 4646
          hostPort: 4646
      volumeMounts:
        - name: nomad-config
          mountPath: /etc/nomad/:Z
        - name: nomad-data
          mountPath: /var/***REMOVED***Z
  volumes:
    - name: nomad-config
      hostPath:
        path: /etc/nomad
        type: Directory
    - name: nomad-data
      hostPath:
        path: /var/nomad
        type: Directory
