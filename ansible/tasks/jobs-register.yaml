---
# Re-resolve the configured DNS names after replacing the staging server.
- name: Refresh staging Nomad client server list
  command: "nomad node config -update-servers {{ nomad_servers | join(' ') }}"
  register: nomad_servers_updated
  changed_when: false
  until: nomad_servers_updated.rc == 0
  retries: 10
  delay: 10
  when: deployment | default('production') == 'staging'

- block:
    - name: Create directory with nomad job definitions
      file:
        path: "nomad"
        state: directory
        mode: "a+rwx"

    - name: Render nomad job definitions
      template:
        dest: "nomad/{{ item }}.nomad"
        src: "{{ worker_deployment_data }}/jobs/{{ item }}.nomad"
        mode: "a+rwx"
      with_items: "{{ jobs }}"

    - name: Register nomad jobs
      command: "nomad run nomad/{{ item }}.nomad"
      with_items: "{{ jobs }}"
      register: result
      until: result.rc == 0
      retries: 10
      delay: 10

  # noamd jobs need to be registered only once
  run_once: true
