---
- name: Create podman secrets for citool config
  become: true
  no_log: true
  shell: |
    podman secret rm "{{ item.name }}" 2>/dev/null || true
    {% if item.file is defined %}
    podman secret create "{{ item.name }}" "{{ item.file }}"
    {% else %}
    cat <<'EOF' | podman secret create "{{ item.name }}" -
    {{ item.content }}
    EOF
    {% endif %}
  loop: "{{ citool_config_podman_secrets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: citool_config_podman_secrets is defined

- name: Ensure citool config secrets directory exists
  become: true
  file:
    path: /etc/citool.d/config
    state: directory
    mode: "0755"
  when: citool_config_podman_secrets is defined

- name: Render citool config secrets content to files
  become: true
  no_log: true
  copy:
    content: "{{ item.content }}"
    dest: "/etc/citool.d/config/{{ item.name }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ citool_config_podman_secrets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - citool_config_podman_secrets is defined
    - item.content is defined

- name: Copy citool config secret files
  become: true
  no_log: true
  copy:
    src: "{{ item.file }}"
    dest: "/etc/citool.d/config/{{ item.name }}"
    remote_src: true
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ citool_config_podman_secrets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - citool_config_podman_secrets is defined
    - item.file is defined
