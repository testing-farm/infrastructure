# containers.conf drop-in for the citool container, mounted by `citool-container.sh` with
# `CITOOL_HOST_PODMAN=1`. The podman client in the container then drives the rootful podman of the
# worker host instead of a nested one.
[engine]
remote = true
active_service = "host"

[engine.service_destinations.host]
uri = "unix:///run/podman/podman.sock"
