---
#
# tmt-web pod
#
- name: Create pods directory
  become: true
  ansible.builtin.file:
    path: "{{ tmt_web_pod_file | dirname }}"
    state: directory
    mode: "0755"

- name: Create tmt-web directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    setype: container_file_t
    selevel: s0
  loop:
    - "{{ tmt_web_config_dir }}"
    - "{{ tmt_web_clone_dir }}"

- name: Trust an extra CA in tmt-web
  when: tmt_web_extra_ca_file | length > 0
  block:
    - name: Read host CA bundle
      become: true
      ansible.builtin.slurp:
        src: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
      register: tmt_web_host_ca_bundle

    # The host bundle can predate the extra CA, e.g. the Red Hat IT Internal Root CA that internal Git hosts chain to.
    # play kube does not relabel hostPath volumes, so the bundle is labeled explicitly.
    - name: Create CA bundle for tmt-web
      become: true
      ansible.builtin.copy:
        content: |
          {{ tmt_web_host_ca_bundle.content | b64decode | trim }}
          {{ lookup('ansible.builtin.file', tmt_web_extra_ca_file) }}
        dest: "{{ tmt_web_config_dir }}/tls-ca-bundle.pem"
        mode: "0644"
        setype: container_file_t
        selevel: s0

    - name: Template tmt-web git config
      become: true
      ansible.builtin.template:
        src: gitconfig.j2
        dest: "{{ tmt_web_config_dir }}/gitconfig"
        mode: "0644"
        setype: container_file_t
        selevel: s0

- name: Template tmt-web pod definition
  become: true
  ansible.builtin.template:
    src: tmt-web.yaml.j2
    dest: "{{ tmt_web_pod_file }}"
    mode: "0644"

- name: Template tmt-web systemd unit
  become: true
  ansible.builtin.template:
    src: tmt-web.service.j2
    dest: /etc/systemd/system/tmt-web.service
    mode: "0644"

# Always restart, the unit pulls the newest images on start
- name: Enable and restart tmt-web
  become: true
  ansible.builtin.systemd:
    name: tmt-web
    enabled: true
    state: restarted
    daemon_reload: true
  # On the first run in check mode the unit does not exist yet
  ignore_errors: "{{ ansible_check_mode }}"
  tags: update_tmt_web

#
# Front end
#
- name: Configure the tmt-web front end
  ansible.builtin.include_tasks: "{{ tmt_web_frontend }}.yaml"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
